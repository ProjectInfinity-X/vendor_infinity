name: build

runs:
    using: composite

    steps:
    - name: Install dependencies
      shell: bash
      run: sudo apt -y install libxml2-utils

    - name: Validate XML syntax
      shell: bash
      run: |
        while IFS= read -r -d '' file; do
          xmllint --noout "$file" || exit
        done < <(git ls-files -z '*.xml')

    - name: Validate apns-conf.xml
      shell: bash
      run: xmllint --noout --schema ./tools/apns-conf.xsd ./prebuilt/common/etc/apns-conf.xml

    - name: Validate sensitive_pn.xml
      shell: bash
      run: xmllint --noout --schema ./tools/SpnInfo.xsd ./prebuilt/common/etc/sensitive_pn.xml
